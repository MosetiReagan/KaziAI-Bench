id: security.prototype-pollution
version: 1.0.0
name: "Prevent Object Prototype Pollution in Merge"
description: >
  Block __proto__, constructor, and prototype property keys in recursive object deep merge. [kazi-canary-s5e05]
category: security
difficulty: hard
author: KaziAI Research Team
tags:
  - security
  - hard
  - "kazi-canary-s5e05"
public: true

environment:
  type: isolated-process
  fixture_path: benchmarks/security/prototype-pollution/fixture

agent:
  tools:
    - terminal
    - filesystem
  initial_prompt: >
    Block __proto__, constructor, and prototype property keys in recursive object deep merge. Inspect problem.md and resolve the issue. Run node verify.js to test your fix.

constraints:
  network: disabled
  max_duration_seconds: 300
  max_steps: 40
  max_tokens: 40000
  resources:
    memory_limit_mb: 512
    cpu_limit: 2.0
    disk_limit_mb: 1024

verification:
  type: deterministic
  checks:
    - name: Run Verification Script
      type: command
      command: node verify.js
      expected_exit_code: 0
      expected_output: "PASS: security.prototype-pollution verified successfully"
      weight: 1.0

scoring:
  minimum_score: 0.9
  weights:
    correctness: 0.40
    reliability: 0.20
    safety: 0.15
    efficiency: 0.10
    recovery: 0.10
    cost: 0.05
