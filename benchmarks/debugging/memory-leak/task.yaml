category: debugging
difficulty: hard
author: KaziAI Research Team
tags:
  - debugging
  - hard
  - "kazi-canary-d1a01"
public: true

environment:
  type: isolated-process
  fixture_path: benchmarks/debugging/memory-leak/fixture

agent:
  tools:
    - terminal
    - filesystem
  initial_prompt: >
    Identify and eliminate closure retain cycle leaking memory on WebSocket reconnect. Inspect problem.md and resolve the issue. Run node verify.js to test your fix.

constraints:
