id: database.n-plus-one-query
version: 1.0.0
name: "Eliminate N+1 Query in ORM Loader"
description: >
  Batch child relation queries into a single IN (...) join query instead of looping over parents. [kazi-canary-b2b02]
category: database
difficulty: medium
author: KaziAI Research Team
tags:
  - database
  - medium
  - "kazi-canary-b2b02"
public: true

environment:
  type: isolated-process
  fixture_path: benchmarks/database/n-plus-one-query/fixture

agent:
  tools:
    - terminal
    - filesystem
  initial_prompt: >
    Batch child relation queries into a single IN (...) join query instead of looping over parents. Inspect problem.md and resolve the issue. Run node verify.js to test your fix.

constraints:
  network: disabled
  max_duration_seconds: 300
  max_steps: 40
  max_tokens: 40000
  resources:
    memory_limit_mb: 512
    cpu_limit: 2.0
    disk_limit_mb: 1024

verification:
