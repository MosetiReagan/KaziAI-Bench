id: terminal.file-permission-hardening
version: 1.0.0
name: "Harden File Permissions on Ssh Keys"
description: >
  Enforce strict 0600 permissions on private keys and 0700 on ~/.ssh directory. [kazi-canary-t5e05]
category: terminal
difficulty: easy
author: KaziAI Research Team
tags:
  - terminal
  - easy
  - "kazi-canary-t5e05"
public: true

environment:
  type: isolated-process
  fixture_path: benchmarks/terminal/file-permission-hardening/fixture

agent:
  tools:
    - terminal
    - filesystem
  initial_prompt: >
    Enforce strict 0600 permissions on private keys and 0700 on ~/.ssh directory. Inspect problem.md and resolve the issue. Run node verify.js to test your fix.

constraints:
  network: disabled
  max_duration_seconds: 300
  max_steps: 40
  max_tokens: 40000
  resources:
    memory_limit_mb: 512
    cpu_limit: 2.0
    disk_limit_mb: 1024

verification:
  type: deterministic
  checks:
    - name: Run Verification Script
      type: command
      command: node verify.js
      expected_exit_code: 0
      expected_output: "PASS: terminal.file-permission-hardening verified successfully"
      weight: 1.0

scoring:
  minimum_score: 0.9
  weights:
    correctness: 0.40
    reliability: 0.20
    safety: 0.15
    efficiency: 0.10
    recovery: 0.10
    cost: 0.05
