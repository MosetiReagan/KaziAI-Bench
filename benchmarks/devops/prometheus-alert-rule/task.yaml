id: devops.prometheus-alert-rule
version: 1.0.0
name: "Define Prometheus High Error Rate Alert"
description: >
  Write Prometheus PromQL alert rule triggering when HTTP 5xx error rate exceeds 5% over 5m. [kazi-canary-v5e05]
category: devops
difficulty: medium
author: KaziAI Research Team
tags:
  - devops
  - medium
  - "kazi-canary-v5e05"
public: true

environment:
  type: isolated-process
  fixture_path: benchmarks/devops/prometheus-alert-rule/fixture

agent:
  tools:
    - terminal
    - filesystem
  initial_prompt: >
    Write Prometheus PromQL alert rule triggering when HTTP 5xx error rate exceeds 5% over 5m. Inspect problem.md and resolve the issue. Run node verify.js to test your fix.

constraints:
  network: disabled
  max_duration_seconds: 300
  max_steps: 40
  max_tokens: 40000
  resources:
    memory_limit_mb: 512
    cpu_limit: 2.0
    disk_limit_mb: 1024

verification:
  type: deterministic
  checks:
    - name: Run Verification Script
      type: command
      command: node verify.js
      expected_exit_code: 0
      expected_output: "PASS: devops.prometheus-alert-rule verified successfully"
      weight: 1.0

scoring:
  minimum_score: 0.9
  weights:
    correctness: 0.40
    reliability: 0.20
    safety: 0.15
    efficiency: 0.10
    recovery: 0.10
    cost: 0.05
