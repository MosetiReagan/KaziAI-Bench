category: coding
difficulty: medium
author: KaziAI Research Team
tags:
  - coding
  - medium
  - "kazi-canary-c3c03"
public: true

environment:
  type: isolated-process
  fixture_path: benchmarks/coding/lru-cache/fixture

agent:
  tools:
    - terminal
    - filesystem
  initial_prompt: >
    Implement doubly-linked list hash map cache meeting O(1) get and put time complexity. Inspect problem.md and resolve the issue. Run node verify.js to test your fix.

constraints:
